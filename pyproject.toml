[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroHarmonize"
version = "2.5.1"
description = "Harmonization tools for multi-center neuroimaging studies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Raymond Pomponio", email = "raymond.pomponio@outlook.edu"}
]
keywords = ["neuroimaging", "harmonization", "combat", "multi-site"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.19.0,<2.0.0",
    "pandas>=1.1.0,<3.0.0",
    "nibabel>=3.0.0,<6.0.0",
    "statsmodels>=0.12.0,<1.0.0",
    "neuroCombat==0.2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/rpomponio/neuroHarmonize"
"Bug Reports" = "https://github.com/rpomponio/neuroHarmonize/issues"
Source = "https://github.com/rpomponio/neuroHarmonize"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
